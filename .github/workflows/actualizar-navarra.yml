
name: Actualizar Navarra TV

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: actualizar-navarra
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar yt-dlp
        run: python -m pip install --upgrade yt-dlp

      - name: Generar NavarraTV.m3u
        shell: bash
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          video = "https://www.dailymotion.com/video/x8dhap9"

          resultado = subprocess.run(
              [
                  "yt-dlp",
                  "--no-config",
                  "--dump-single-json",
                  "--skip-download",
                  video
              ],
              capture_output=True,
              text=True,
              timeout=120
          )

          if resultado.returncode != 0:
              print(resultado.stderr, flush=True)
              raise RuntimeError("No se pudo obtener Navarra TV")

          datos = json.loads(resultado.stdout)

          formatos = [
              f for f in datos.get("formats", [])
              if f.get("url")
              and ".m3u8" in f["url"]
              and f.get("vcodec") not in (None, "none")
              and f.get("acodec") not in (None, "none")
          ]

          if not formatos:
              raise RuntimeError(
                  "No hay formatos HLS con imagen y sonido"
              )

          # Priorizar 720p y evitar formatos superiores.
          candidatos = [
              f for f in formatos
              if (f.get("height") or 0) <= 720
          ]

          if not candidatos:
              raise RuntimeError("No hay formatos de hasta 720p")

          elegido = max(
              candidatos,
              key=lambda f: (
                  f.get("height") or 0,
                  f.get("tbr") or 0
              )
          )

          enlace = elegido["url"]

          contenido = (
              "#EXTM3U\n"
              '#EXTINF:-1 tvg-name="Navarra TV" '
              'group-title="Autonomicas",Navarra Television HD\n'
              f"{enlace}\n"
          )

          Path("NavarraTV.m3u").write_text(
              contenido,
              encoding="utf-8"
          )

          print("Formato elegido:", elegido["format_id"])
          print("Resolucion:", elegido.get("height"))
          print("NavarraTV.m3u generado correctamente")
          PY

      - name: Publicar lista actualizada
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add NavarraTV.m3u

          if ! git diff --cached --quiet; then
            git commit -m "Actualizar Navarra TV"
            git push
          else
            echo "La lista no ha cambiado"
          fi
